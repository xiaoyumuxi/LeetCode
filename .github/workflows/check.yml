name: Plugin checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify modules
        run: go mod download && go mod verify
      - name: Test changed plugin boundaries
        run: |
          mkdir -p .artifacts
          go test -race -json -count=1 -timeout 45s ./... > .artifacts/test-results.jsonl
      - name: Check code and translations
        run: |
          go vet ./...
          test -z "$(gofmt -l cmd internal scripts/build/*.go)"
          node --check ui/main.js
          node --check ui/messages.js
          go run ./scripts/build/translations.go --check
      - name: Build isolated development package
        run: python3 scripts/build/package.py
      - name: Upload check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-checks-linux
          path: |
            .artifacts/test-results.jsonl
            dist/*.sha256
          if-no-files-found: warn

# 公开站点与真实 Core 网络验收在本机显式执行，不把外部网络作为单元测试条件。
